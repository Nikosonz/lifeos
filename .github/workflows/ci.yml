name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  # GitHub-hosted runners have unrestricted internet access — the repo's
  # .npmrc points at registry.npmmirror.com to work around npmjs.org being
  # blocked from the local dev machine (see CLAUDE.md), but CI doesn't need
  # that workaround and the primary registry is the more reliable default here.
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/db

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  db-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lifeos
          POSTGRES_PASSWORD: lifeos_ci
          POSTGRES_DB: lifeos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://lifeos:lifeos_ci@localhost:5432/lifeos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy
        working-directory: packages/db

  build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/db

      - name: Build
        run: npm run build
        env:
          # Next.js build needs a syntactically valid secret even though no
          # real DB/auth calls happen during a production build.
          JWT_ACCESS_SECRET: ci-build-placeholder-secret-at-least-32-chars
