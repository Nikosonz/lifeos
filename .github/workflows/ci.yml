name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  # GitHub-hosted runners have unrestricted internet access — the repo's
  # .npmrc points at registry.npmmirror.com to work around npmjs.org being
  # blocked from the local dev machine (see CLAUDE.md), but CI doesn't need
  # that workaround and the primary registry is the more reliable default here.
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  quality:
    runs-on: ubuntu-latest
    # packages/db's tests run against real Postgres (see CLAUDE.md's Testing
    # section) and `npm test` fans out to every workspace, so this job needs
    # a live, migrated database — same requirement the local pre-push gate has.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lifeos
          POSTGRES_PASSWORD: lifeos_ci
          POSTGRES_DB: lifeos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://lifeos:lifeos_ci@localhost:5432/lifeos
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/db

      - name: Apply migrations
        run: npx prisma migrate deploy
        working-directory: packages/db

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  db-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lifeos
          POSTGRES_PASSWORD: lifeos_ci
          POSTGRES_DB: lifeos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://lifeos:lifeos_ci@localhost:5432/lifeos
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate
        working-directory: packages/db

      - name: Apply migrations
        run: npx prisma migrate deploy
        working-directory: packages/db

  build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/db

      - name: Build
        run: npm run build
        env:
          # Next.js build needs a syntactically valid secret even though no
          # real DB/auth calls happen during a production build.
          JWT_ACCESS_SECRET: ci-build-placeholder-secret-at-least-32-chars

  # Stage C — not live yet (see .claude/skills/deployment/SKILL.md and
  # CLAUDE.md's delivery-sequence note). The deploy step is deliberately a
  # no-op until DEPLOY_HOST is configured as a repository secret: no VPS
  # exists yet, so there is nothing to SSH into. `secrets` is NOT a valid
  # context inside any `if:` (job- or step-level) — verified directly with
  # actionlint after two wrong attempts assumed otherwise. The only correct
  # way to conditionally skip on a secret's presence is to mirror it into a
  # job-level `env:` first (env IS a valid `if:` context) and check that.
  # Add DEPLOY_HOST/DEPLOY_USER/DEPLOY_SSH_KEY/DEPLOY_PATH as repo secrets
  # once the VPS is provisioned to turn this on; nothing else here needs
  # to change.
  deploy:
    runs-on: ubuntu-latest
    needs: [quality, build, db-migration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: Deploy over SSH
        if: env.DEPLOY_HOST != ''
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml --profile migrate run --rm migrate
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
