org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Works around a Kotlin incremental-compiler bug on Windows: its relocatable
# cache computes relative paths between the pub cache (C:\Users\...) and this
# project (D:\...) and throws "this and base files have different roots"
# whenever those are on different drives — hit building shared_preferences_
# android for the first time, since flutter_secure_storage's Android side
# happens to be Java, not Kotlin. Forces a full (non-incremental) Kotlin
# compile every time instead of the buggy incremental path.
kotlin.incremental=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
