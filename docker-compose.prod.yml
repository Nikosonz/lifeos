# Production compose — separate from docker-compose.yml (dev-only Postgres
# + Redis with hardcoded lifeos/lifeos_dev credentials). Real secrets are
# injected via the environment — never committed, never reused from
# .env.example. See .claude/skills/deployment/SKILL.md.
#
# Secrets live in `.env` NEXT TO THIS FILE on the VPS (/opt/maaleto/.env,
# chmod 600). The name is not cosmetic: `docker compose` auto-loads `.env`
# from the project directory and nothing else, so the CI deploy job in
# .github/workflows/ci.yml — which passes no --env-file — would start the
# stack with every ${VAR} empty if the file were called anything else.
# It survives the deploy job's `git reset --hard` because .gitignore's
# `.env*` rule keeps it untracked.
#
# Usage on the VPS:
#   docker compose -f docker-compose.prod.yml run --rm migrate   # before first `up`, and after every pull
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Required env vars (fail loudly if unset — no dev-value fallbacks here,
# unlike the dev compose file, since a silent fallback in production is
# exactly the kind of dev-shortcut this file exists to prevent):
#   POSTGRES_PASSWORD, JWT_ACCESS_SECRET, KAVENEGAR_API_KEY (once SMS_PROVIDER=kavenegar)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — see .claude/skills/deployment/SKILL.md}
      POSTGRES_DB: lifeos
    # No published host port — only reachable by other services on this
    # compose's internal network, unlike the dev compose file which
    # publishes 5432 for host-side psql/Prisma Studio access.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeos -d lifeos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lifeos:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/lifeos
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be set — see .claude/skills/deployment/SKILL.md}
      NODE_ENV: production
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
      # Email is the only working login channel — SMS has no real adapter
      # yet. env.ts refuses to boot in production on the mock provider, so
      # these three are effectively required despite the compose default.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mock}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # The header the reverse proxy OVERWRITES (Caddy sets X-Real-IP). Per-IP
      # rate limits are best-effort until this names a header a client cannot
      # forge — see packages/core/src/config/env.ts.
      TRUSTED_PROXY_IP_HEADER: ${TRUSTED_PROXY_IP_HEADER:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL must be set}
    # Loopback-only, exactly like n8n on this host. TLS and the public port
    # are the reverse proxy's job; publishing 0.0.0.0:3000 would put the app
    # on the internet unencrypted, and Docker writes its own iptables rules,
    # so UFW would still report deny-all while it happened.
    ports:
      - "127.0.0.1:3000:3000"

  # One-off: targets the `builder` stage (full node_modules incl. the
  # `prisma` CLI), not the lean `web`/`worker` runtime images, which
  # deliberately don't ship it. Verified directly: `docker compose run --rm
  # migrate` against a real Postgres correctly reports pending/applied
  # migrations. `profiles: [migrate]` keeps this out of a plain `up -d` —
  # it only runs when explicitly invoked.
  migrate:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: builder
    working_dir: /app/packages/db
    command: npx prisma migrate deploy
    profiles: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lifeos:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/lifeos

  # Behind a profile, so a plain `up -d` does NOT start it — same mechanism
  # as `migrate` above, for a different reason.
  #
  # apps/worker is still the placeholder CLAUDE.md describes: it has no
  # queues and no jobs, so its process prints one line and exits 0. Combined
  # with `restart: unless-stopped` that is a permanent restart loop — it was
  # observed doing exactly that on the first production `up`, respawning
  # every few seconds forever. On a 2-CPU box that burns real cycles and
  # fills the log with an event that looks like a crash to any monitoring
  # added later, all to run nothing.
  #
  # Remove `profiles` in the same change that gives the worker its first
  # real job; the service definition is otherwise correct and stays here so
  # that change is a one-line edit.
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    profiles: ["worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lifeos:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/lifeos
      REDIS_URL: redis://redis:6379

volumes:
  pgdata:
  redisdata:
